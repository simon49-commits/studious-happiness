// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Use the build-tools that ship with Unity's Android SDK on this laptop, and Unity's Java 17
subprojects {
    afterEvaluate { p ->
        if (p.hasProperty('android')) {
            p.android.buildToolsVersion = "36.0.0"
            p.android.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
            p.android.compileOptions.targetCompatibility = JavaVersion.VERSION_17
        }
    }
}

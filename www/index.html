<script>
/* Heavy tools load only when needed, so the app opens faster. */
window.loadScript = src => new Promise((res, rej) => { if (document.querySelector(`script[data-src="${src}"]`)) return res();
  const s = document.createElement('script'); s.src = src; s.dataset.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(s); });
window.ensurePdf = async () => { if (!window.jspdf) await loadScript('jspdf.umd.min.js'); if (!(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API.autoTable)) await loadScript('jspdf.plugin.autotable.min.js'); };
window.ensureZip = async () => { if (!window.JSZip) await loadScript('jszip.min.js'); };
</script>

<script>
/* App shim: TaxKeep's export asks for a "downloads" capability. In the Android app,
   that is provided by saving the ZIP to the app's cache and opening Android's share sheet. */
window.claude = { use: async function(name){
  if (name !== 'downloads') return null;
  var P = window.Capacitor && window.Capacitor.Plugins;
  if (!P || !P.Filesystem || !P.Share) return null;
  return { save: async function(opts){
    var b64 = await new Promise(function(res, rej){ var r = new FileReader(); r.onload = function(){ res(String(r.result).split(',')[1]); }; r.onerror = rej; r.readAsDataURL(opts.data); });
    var w = await P.Filesystem.writeFile({ path: opts.filename, data: b64, directory: 'CACHE' });
    try {
      await P.Share.share({ title: opts.filename, files: [w.uri], dialogTitle: 'Save or send your tax package' });
    } catch (e) {
      var m = String((e && e.message) || e);
      if (/cancel/i.test(m)) { var err = new Error('cancelled'); err.code = 'declined'; throw err; }
      throw e;
    }
  }};
}};
</script>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#111827; --muted:#6b7280; --line:#e6e8ec;
  --brand:#047857; --brand2:#ecfdf5; --onbrand:#ffffff; --gold:#d97706; --goldbg:#fffbeb;
  --hero:linear-gradient(135deg,#065f46,#047857); --heroOwe:linear-gradient(135deg,#9a3412,#c2410c);
  --warn:#b45309; --warnbg:#fffbeb; --bad:#b91c1c; --badbg:#fef2f2; --ok:#047857; --okbg:#ecfdf5;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06); --r:16px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0b0f14; --card:#151b23; --ink:#f3f4f6; --muted:#9ca3af; --line:#242c36;
    --brand:#34d399; --brand2:#10261f; --onbrand:#052e22; --gold:#fbbf24; --goldbg:#2a2110;
    --hero:linear-gradient(135deg,#065f46,#064e3b); --heroOwe:linear-gradient(135deg,#7c2d12,#9a3412);
    --warn:#fbbf24; --warnbg:#2a2110; --bad:#f87171; --badbg:#2b1416; --ok:#34d399; --okbg:#10261f; --shadow:none;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{padding:14px 16px 6px;display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;z-index:4;background:var(--bg)}
header select{width:auto;padding:7px 30px 7px 12px;border-radius:99px;font-weight:700;background:var(--card)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px}
.logo svg{flex:none}
.badge{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--brand2);color:var(--brand);font-weight:600;white-space:nowrap}
.logo .wm b{color:var(--brand)}
.logo{font-size:20px;letter-spacing:-.01em}
.proto{margin:0 18px 6px;font-size:12px;color:var(--muted)}
main{flex:1;padding:6px 14px 100px}
h2{font-size:20px;margin:10px 4px 12px}
h3{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .n{font-size:22px;font-weight:700}
.stat .l{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--brand);color:var(--onbrand)}
.btn.sec{background:var(--brand2);color:var(--brand)}
.btn.ghost{background:transparent;color:var(--brand);padding:6px 8px}
.btn.danger{background:var(--badbg);color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:86px;border-radius:99px;padding:14px 18px;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:5}
#plus{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;border:0;background:var(--brand);color:var(--onbrand);font-size:30px;line-height:1;font-weight:500;box-shadow:0 8px 20px rgba(4,120,87,.30);z-index:5;cursor:pointer}
#plus[hidden]{display:none}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:560px;width:100%;display:flex}
nav.tabs button{flex:1;background:none;border:0;padding:9px 2px 10px;font-size:11px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button.on{color:var(--brand);font-weight:600}
nav.tabs svg{width:22px;height:22px}
.alert{border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:14px;display:flex;gap:8px}
.alert.warn{background:var(--warnbg);color:var(--warn)}
.alert.bad{background:var(--badbg);color:var(--bad)}
.alert.ok{background:var(--okbg);color:var(--ok)}
.alert.info{background:var(--brand2);color:var(--brand)}
.list .item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .item:last-child{border-bottom:0}
.thumb{width:46px;height:46px;border-radius:10px;background:var(--brand2);flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--brand);font-weight:700}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 11px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--onbrand)}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:10px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
textarea{min-height:60px}
input[type=range],input[type=checkbox]{accent-color:var(--brand)}
.q{padding:12px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.yn{display:flex;gap:6px;margin-top:8px}
.yn button{flex:1;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600}
.yn button.yes{background:var(--brand);border-color:var(--brand);color:var(--onbrand)}
.yn button.no{background:var(--muted);border-color:var(--muted);color:#fff}
.doc{display:flex;gap:10px;align-items:flex-start;padding:7px 0}
.doc input{width:20px;height:20px;margin-top:1px;accent-color:var(--brand);flex:none}
.doc.done span{text-decoration:line-through;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar.over>i{background:var(--bad)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mode{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.mode.on{border-color:var(--brand);background:var(--brand2)}
.mode b{display:block;margin-bottom:2px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.open{display:flex}
#modal .sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px 28px}
@media(min-width:620px){#modal{align-items:center}#modal .sheet{border-radius:18px}}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.preview{width:100%;max-height:340px;object-fit:contain;border-radius:10px;background:var(--bg);margin-bottom:8px}
.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;cursor:pointer;color:var(--muted)}
.drop.has{border-style:solid;border-color:var(--brand);color:var(--brand)}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.disc{font-size:12px;color:var(--muted);text-align:center;padding:4px 10px 12px}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:s 1s linear infinite;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td{padding:6px 0;border-bottom:1px solid var(--line)}
table.t td:last-child{text-align:right;font-weight:600}

/* ---- polish ---- */
.card{box-shadow:0 1px 2px rgba(16,40,32,.05)}
header{padding-top:max(16px,env(safe-area-inset-top))}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.qa button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink)}
.qa svg{width:24px;height:24px;color:var(--brand)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--brand2);color:var(--brand);white-space:nowrap}
.pill.grey{background:var(--line);color:var(--muted)}
.scan{display:flex;align-items:center;gap:10px;background:var(--brand2);color:var(--brand);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.scan.ok{background:var(--okbg);color:var(--ok)}
.scan.warn{background:var(--warnbg);color:var(--warn)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.toggle input{width:22px;height:22px;accent-color:var(--brand);flex:none}
.map{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;align-items:center}
.preview-t{font-size:12px;width:100%;border-collapse:collapse;table-layout:fixed}
.preview-t td{padding:4px 2px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ---- lock screen ---- */
#lockScreen{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
.lk-in{width:100%;max-width:320px;text-align:center}
.lk-logo{margin-bottom:10px}
.lk-title{margin:6px 0 4px;font-size:20px}
.lk-sub{min-height:38px;font-size:14px;margin:0 0 6px}
.lk-dots{display:flex;justify-content:center;gap:14px;margin:12px 0 24px}
.lk-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--brand)}
.lk-dots i.on{background:var(--brand)}
.lk-dots.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.lk-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.lk-pad button{width:72px;height:72px;justify-self:center;border-radius:50%;border:0;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.08);font-size:24px;font-weight:600;cursor:pointer;color:var(--ink)}
.lk-pad .lk-alt{font-size:15px;color:var(--brand);background:none;box-shadow:none}
.lk-pad .lk-alt svg{width:30px;height:30px}
.lk-pad button[data-k="del"]{background:none;box-shadow:none;font-size:22px}
/* ---- onboarding ---- */
#onb{position:fixed;inset:0;background:var(--bg);z-index:90;display:flex;flex-direction:column;overflow:auto}
#onb .ob-in{flex:1;max-width:460px;width:100%;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 22px 28px;display:flex;flex-direction:column}
.ob-art{height:180px;border-radius:24px;background:linear-gradient(160deg,var(--brand2),var(--card));display:flex;align-items:center;justify-content:center;margin:12px 0 22px;flex:none}
.ob-art svg{width:92px;height:92px;color:var(--brand)}
#onb h1{font-size:26px;line-height:1.2;margin:0 0 10px}
#onb p{color:var(--muted);margin:0 0 12px;font-size:16px}
.ob-dots{display:flex;gap:6px;justify-content:center;margin:auto 0 16px;padding-top:16px}
.ob-dots i{width:8px;height:8px;border-radius:99px;background:var(--line)}
.ob-dots i.on{width:22px;background:var(--brand)}
.ws h3{margin-bottom:2px}.ws .form{font-size:12px;color:var(--muted);margin-bottom:8px}
.wt{width:100%;border-collapse:collapse;font-size:13px}.wt td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.wt td.ln{color:var(--brand);font-weight:700;white-space:nowrap;width:1%;padding-right:8px}.wt td.am{text-align:right;white-space:nowrap;font-weight:600}
.wt tr.strong td{font-weight:700;border-top:2px solid var(--line)}.wt .src{display:block;color:var(--muted);font-size:11.5px}
.slipbox{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.slipbox label.f{font-size:12px}
  .est{border-radius:var(--r);padding:16px 18px;color:#fff;background:var(--hero);margin-bottom:12px;cursor:pointer;box-shadow:0 8px 24px rgba(10,89,68,.18);position:relative;overflow:hidden}.est.owe{background:var(--heroOwe);box-shadow:0 8px 24px rgba(138,47,16,.18)}
.est:after{content:'';position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
.est .big{font-size:28px;font-weight:800;margin:2px 0;letter-spacing:-.01em}.est .sm{opacity:.85;font-size:13px}
.next{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.next .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.next h3{margin:4px 0 4px;font-size:19px}.next p{margin:0 0 12px;color:var(--muted);font-size:14px}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:2px 0 12px}.bar i{display:block;height:100%;background:var(--brand)}
.addbtn{width:100%;border:0;border-radius:16px;padding:15px;font-size:17px;font-weight:800;background:var(--brand);color:var(--onbrand);margin-bottom:12px;cursor:pointer;box-shadow:0 6px 18px rgba(14,124,93,.22)}
.mrow{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer}.mrow:last-child{border-bottom:0}
.mrow .ic{width:38px;height:38px;border-radius:11px;background:var(--brand2);color:var(--brand);display:flex;align-items:center;justify-content:center;flex:none}
.mrow .ic svg{width:21px;height:21px}.mrow .grow b{display:block;font-size:15px}.mrow .grow span{font-size:13px;color:var(--muted)}
.mrow .chev{color:var(--muted);font-size:20px}.mrow .val{font-weight:700;white-space:nowrap}
.back{background:none;border:0;color:var(--brand);font-weight:700;font-size:15px;padding:4px 0 10px;cursor:pointer}
.tag{display:inline-block;background:var(--brand2);color:var(--brand);font-weight:700;border-radius:7px;padding:2px 7px;font-size:12px;margin-right:6px}
</style>
</head>

<script>
/* ---------------- constants ---------------- */
const PERSONAL = [
  ['medical','Medical & dental'],['donations','Donations'],['childcare','Childcare'],['moving','Moving'],
  ['tuition','Tuition & education'],['disability','Disability-related'],['accessibility','Home accessibility'],
  ['dues','Union & professional dues'],['employment','Employment expenses'],['rent','Rent / property tax'],['otherp','Other personal']];
const BUSINESS = [
  ['b_adv','Advertising'],['b_meals','Meals & entertainment'],['b_office','Office expenses'],['b_supplies','Supplies'],
  ['b_fees','Legal & accounting fees'],['b_rent','Business rent'],['b_repairs','Repairs & maintenance'],['b_phone','Phone & internet'],
  ['b_travel','Travel'],['b_vehicle','Vehicle (fuel, repairs, insurance)'],['b_home','Business-use-of-home'],['b_ins','Insurance'],['b_other','Other business']];
const ALLCATS = Object.fromEntries([...PERSONAL,...BUSINESS]);
const QUESTIONS = [
  {id:'employed',q:'Did you work for an employer this year?',docs:['T4 slip from each employer']},
  {id:'wfh',q:'Did your employer require you to work from home or pay your own work costs?',docs:['T2200 or T2200S from your employer','Receipts for work expenses'],cat:'employment'},
  {id:'invest',q:'Did you earn bank interest or investment income?',docs:['T5 / T3 slips','T5008 for investments you sold']},
  {id:'rrsp',q:'Did you contribute to an RRSP?',docs:['RRSP contribution receipts (incl. first 60 days of next year)']},
  {id:'fhsa',q:'Do you have a First Home Savings Account (FHSA)?',docs:['T4FHSA slip']},
  {id:'student',q:'Did you pay tuition or attend post-secondary school?',docs:['T2202 tuition slip'],cat:'tuition'},
  {id:'kids',q:'Did you pay for daycare, before/after-school care or day camps?',docs:["Childcare receipts showing the provider's name and SIN or business number"],cat:'childcare'},
  {id:'medical',q:'Did you pay for prescriptions, dental, glasses or other medical costs not covered by insurance?',docs:['Medical and dental receipts','Insurance claim statements'],cat:'medical'},
  {id:'donate',q:'Did you donate to registered charities?',docs:['Official donation receipts'],cat:'donations'},
  {id:'moved',q:'Did you move at least 40 km closer to a new job or school?',docs:['Moving receipts (movers, travel, temporary lodging)'],cat:'moving'},
  {id:'benefits',q:'Did you receive EI, a pension, or RRSP/RRIF withdrawals?',docs:['T4E (EI)','T4A / T4A(P) / T4A(OAS)','T4RSP / T4RIF']},
  {id:'disab',q:'Do you or a dependant have (or plan to apply for) the disability tax credit?',docs:['T2201 approval letter or form'],cat:'disability'},
  {id:'renter',q:'Did you pay rent or property tax? (some provincial credits use it)',docs:['Rent receipts or property tax statement'],cat:'rent'},

/* ---------------- storage: device (IndexedDB) ---------------- */
function idbOpen(){
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open('taxkeep', 1);
      r.onupgradeneeded = () => { const d = r.result; ['kv','receipts','files'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); }); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    } catch(e){ rej(e); }
  });
}
function idbDo(d, name, mode, fn){
  return new Promise((res, rej) => {
    const tx = d.transaction(name, mode); const rq = fn(tx.objectStore(name));
    tx.oncomplete = () => res(rq ? rq.result : undefined); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  });
}
function makeMemoryStore(){
  const kv = new Map(), rc = new Map(), fl = new Map();
  return { kind:'memory', label:'Temporary (not saved)',
    loadState: async () => kv.get('state'), saveState: async s => { kv.set('state', JSON.parse(JSON.stringify(s))); },
    listReceipts: async () => [...rc.values()], putReceipt: async m => { rc.set(m.id, {...m}); }, deleteReceipt: async id => { rc.delete(id); },
    getFile: async id => fl.get(id), putFile: async (id, f) => { fl.set(id, f); }, deleteFile: async id => { fl.delete(id); } };
}
async function makeDeviceStore(){
  try {
    const d = await idbOpen();
    return { kind:'device', label:'On this device',
      loadState: () => idbDo(d,'kv','readonly', os => os.get('state')),
      saveState: s => idbDo(d,'kv','readwrite', os => os.put(JSON.parse(JSON.stringify(s)), 'state')),
      listReceipts: () => idbDo(d,'receipts','readonly', os => os.getAll()),
      putReceipt: m => idbDo(d,'receipts','readwrite', os => os.put({...m}, m.id)),
      deleteReceipt: id => idbDo(d,'receipts','readwrite', os => os.delete(id)),
      getFile: id => idbDo(d,'files','readonly', os => os.get(id)),
      putFile: (id, f) => idbDo(d,'files','readwrite', os => os.put(f, id)),
      deleteFile: id => idbDo(d,'files','readwrite', os => os.delete(id)) };
  } catch(e){ return makeMemoryStore(); }
}

/* ---------------- storage: cloud vault (artifact db, private per person) ---------------- */
async function makeCloudStore(){
  const [db, user] = await Promise.all([capUse('db'), capUse('user')]);
  if (!db || !user) return null;
  let uid = null; try { uid = await user.id(); } catch(e){}
  if (!uid) return null;
  const vault = db.doc('data/users/' + uid + '/vault');
  const stateDoc = db.doc('data/users/' + uid + '/state');
  const rc = vault.collection('receipts'), fc = vault.collection('files');
  return { kind:'cloud', label:'Cloud vault',
    loadState: async () => { const s = await stateDoc.get(); return s.exists ? JSON.parse(JSON.stringify(s.data())) : undefined; },
    saveState: s => stateDoc.set(JSON.parse(JSON.stringify(s))),
    listReceipts: async () => { const q = await rc.limit(1000).get(); return q.docs.map(d => ({...d.data()})); },
    putReceipt: m => rc.doc(m.id).set({...m}),
    deleteReceipt: id => rc.doc(id).delete(),
    getFile: async id => { const s = await fc.doc(id).get(); return s.exists ? {...s.data()} : undefined; },
    putFile: (id, f) => fc.doc(id).set({...f}),
    deleteFile: id => fc.doc(id).delete() };
}

/* ---------------- images ---------------- */
function readFile(file){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(file); }); }
function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function shrinkImage(dataUrl, maxChars, maxDim){
  const img = await loadImg(dataUrl);
  let dim = Math.min(maxDim, Math.max(img.width, img.height)), q = 0.82, out = dataUrl;
  for (let i = 0; i < 9; i++){
    const s = dim / Math.max(img.width, img.height);
    const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    out = c.toDataURL('image/jpeg', q);
    if (out.length <= maxChars) return out;
    dim *= 0.82; q = Math.max(0.5, q - 0.07);
  }
  return out.length <= maxChars ? out : null;
}
async function fitFor(kind, f){
  if (!f) return f;
  const limit = kind === 'cloud' ? CLOUD_MAX : 6000000;
  if (f.dataUrl.length <= limit) return f;
  if (/^image\/(jpeg|png|webp|gif|heic|heif|bmp)/.test(f.type)){
    const s = await shrinkImage(f.dataUrl, limit, kind === 'cloud' ? 1600 : 3000).catch(() => null);
    return s ? {...f, type:'image/jpeg', dataUrl:s, name:f.name.replace(/\.\w+$/, '') + '.jpg'} : null;
  }
  return null;
}
function extFor(f){ const m = { 'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif','image/svg+xml':'svg','application/pdf':'pdf' }; return m[f.type] || (f.name.split('.').pop() || 'bin'); }

/* ---------------- calculations ---------------- */
function room(){
  const c = state.room.contribs.filter(x => x.year === Y());
  const s = (a, t) => sum(c.filter(x => x.acct === a && x.type === t).map(x => x.amount));
  const rr = { limit:num(state.room.rrspLimit), set:state.room.rrspLimit !== '', used:s('rrsp','contrib') };
  rr.left = rr.limit - rr.used; rr.over = Math.max(0, rr.used - rr.limit); rr.penal = Math.max(0, rr.over - 2000);
  const tf = { limit:num(state.room.tfsaRoom), set:state.room.tfsaRoom !== '', used:s('tfsa','contrib'), wd:s('tfsa','withdraw') };
  tf.left = tf.limit - tf.used; tf.over = Math.max(0, -tf.left);
  const fh = { open:!!state.room.fhsaOpen, limit:8000 + Math.min(8000, num(state.room.fhsaCarry)), used:s('fhsa','contrib'), prior:num(state.room.fhsaPrior) };
  fh.left = fh.limit - fh.used; fh.over = Math.max(0, -fh.left); fh.life = 40000 - fh.prior - fh.used;
  return { rr, tf, fh };
}
function biz(){
  const inc = state.income.filter(x => x.year === Y() && x.type === 'self'), mil = state.mileage.filter(x => x.year === Y());
  const rs = yearReceipts().filter(r => isBiz(r.category));
  const income = sum(inc.map(x => x.amount)), gst = sum(inc.map(x => x.gst));
  const bizKm = sum(mil.map(x => x.km)), totalKm = num(state.totalKm[Y()]);
  const usePct = totalKm > 0 ? Math.min(1, bizKm / totalKm) : null;
  let exp = 0;
  rs.forEach(r => { let a = num(r.amount); if (r.category === 'b_meals') a *= 0.5; if (r.category === 'b_vehicle' && usePct !== null) a *= usePct; exp += a; });
  const net = income - exp, setAside = Math.max(0, net) * num(state.setAsidePct) / 100;
  return { inc, mil, rs, income, gst, bizKm, totalKm, usePct, exp, net, setAside };
}

const cloudUser = () => window.TaxKeepCloud ? TaxKeepCloud.user() : null;
function backupAgo(){ const t = window.TaxKeepCloud ? TaxKeepCloud.lastBackup() : 0; if (!t) return 'not backed up yet';
  const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'backed up just now' : m < 60 ? `backed up ${m} min ago` : m < 1440 ? `backed up ${Math.round(m / 60)} h ago` : `backed up ${new Date(t).toLocaleDateString('en-CA')}`; }
function fileIds(){
  return receipts.filter(r => r.hasFile).map(r => ({ id: r.id, size: String(r.fileAt || r.created || 1) }))
    .concat(state.slips.filter(x => x.hasFile).map(x => ({ id: 'slip_' + x.id, size: String(x.fileAt || 1) })));

let backupBusy = false, backupTimer = null, backupMsg = '';
function scheduleBackup(){ if (!cloudUser() || state.cloudAuto === false) return; clearTimeout(backupTimer); backupTimer = setTimeout(() => runBackup(false), 15000); }
async function runBackup(manual){
  if (!cloudUser() || backupBusy) return; backupBusy = true; backupMsg = 'Backing up…'; if (tab === 'more' && moreSec === 'backup') render();
  try {
    const r = await TaxKeepCloud.backup({ state, receipts, getFile: id => store.getFile(id), fileIds: fileIds(), version: '1.9',
      onProgress: (d, n) => { backupMsg = `Uploading photos… ${d} of ${n}`; const el = document.getElementById('bkMsg'); if (el) el.textContent = backupMsg; } });
    backupMsg = ''; if (manual) toast(r.uploaded ? `Backed up (${r.uploaded} new photo${r.uploaded > 1 ? 's' : ''})` : 'Backed up');
  } catch(e){ backupMsg = 'Backup failed: ' + e.message; if (manual) toast(backupMsg); }
  backupBusy = false; if (tab === 'more' && moreSec === 'backup' || tab === 'home') render();
}
async function runRestore(){
  openSheet(`<div class="empty"><span class="spin"></span><p id="rsMsg">Downloading your backup…</p></div>`);
  try {
    const r = await TaxKeepCloud.restore({ putFile: (id, f) => store.putFile(id, f), onProgress: (d, n) => { const el = document.getElementById('rsMsg'); if (el) el.textContent = `Downloading photos… ${d} of ${n}`; } });
    for (const m of receipts) if (!r.receipts.some(x => x.id === m.id)){ await store.deleteReceipt(m.id).catch(() => {}); if (m.hasFile) await store.deleteFile(m.id).catch(() => {}); }
    for (const m of r.receipts) await store.putReceipt(m);
    state = mergeState(r.state); await store.saveState(state);
    await loadAll(); closeSheet(); tab = 'home'; render();
    toast(r.failed ? `Restored, but ${r.failed} photo(s) couldn't be downloaded` : 'Everything is restored');
  } catch(e){ closeSheet(); toast(e.message); }
}
async function cloudAuth(create){
  const email = ($('#cEmail') || {}).value.trim(), pw = ($('#cPw') || {}).value;
  if (!/^\S+@\S+\.\S+$/.test(email)){ toast('Enter your email'); return; }
  if (!pw || pw.length < 8){ toast('Use a password with at least 8 characters'); return; }
  const btns = document.querySelectorAll('[data-act=cSignIn],[data-act=cSignUp]'); btns.forEach(b => b.disabled = true);
  try {
    if (create){ const r = await TaxKeepCloud.signUp(email, pw);
      if (r.needsConfirm){ backupMsg = `We sent a link to ${email}. Tap it to confirm, then come back and sign in.`; render(); return; } }
    else await TaxKeepCloud.signIn(email, pw);
    backupMsg = ''; toast('Signed in');
    const local = receipts.length + state.slips.length + state.income.length, cloud = await TaxKeepCloud.info().catch(() => null);
    if (cloud && !local) runRestore();
    else if (cloud && local) { render(); toast('A backup already exists. Use "Restore" to bring it back, or "Back up now" to replace it.'); }
    else { render(); runBackup(true); }
  } catch(e){ toast(e.message); btns.forEach(b => b.disabled = false); }
}

/* ---------------- notice of assessment ---------------- */
function parseNOA(text){
  const flat = text.replace(/\r/g, '');
  const amt = '(\\d{1,3}(?:[ ,]\\d{3})*\\.\\d{2}|\\d+\\.\\d{2})', toN = v => parseFloat(String(v).replace(/[ ,]/g, ''));
  const near = (re, span) => { const m = flat.match(re); if (!m) return null; const after = flat.slice(m.index, m.index + (span || 220)); const a = after.match(new RegExp(amt)); return a ? toN(a[1]) : null; };
  const yearM = flat.match(/RRSP deduction limit (?:for )?(20\d\d)/i) || flat.match(/deduction limit[^\n]{0,40}(20\d\d)/i);
  const tax = flat.match(/notice of (?:re)?assessment[\s\S]{0,200}?(20\d\d)/i) || flat.match(/tax year[^\d]{0,10}(20\d\d)/i);
  return { limitYear: yearM ? +yearM[1] : (tax ? +tax[1] + 1 : null), rrspLimit: near(/RRSP deduction limit/i), unused: near(/unused RRSP[^\n]{0,30}contribution/i),
    tuitionCarry: near(/(?:unused|carry ?forward)[^\n]{0,60}tuition|tuition[^\n]{0,60}(?:carry ?forward|available)/i) };
}

/* ---------------- bank / card statements ---------------- */
async function importStatement(file){
  let rows; try { rows = parseCSV(await file.text()); } catch(e){ toast('Could not read that file.'); return; }
  if (rows.length < 2){ toast('That file has no rows to import.'); return; }
  // Some bank files have no header row: detect by whether row 0 has a date in it.
  const hasHead = !rows[0].some(c => parseAnyDate(c));
  const head = hasHead ? rows[0].map(h => String(h).trim()) : rows[0].map((_, i) => 'Column ' + (i + 1)), body = (hasHead ? rows.slice(1) : rows).slice(0, 5000);
  const share = (c, f) => body.filter(r => f(r[c])).length / body.length;
  const isDate = v => !!parseAnyDate(v), isNum = v => String(v || '').trim() !== '' && isFinite(parseMoney(v));
  const dC = head.findIndex((h, k) => share(k, isDate) > .6);
  const by = re => head.findIndex(h => re.test(h));
  let debitC = by(/debit|withdraw|purchase|charges?$|money out/i), creditC = by(/credit|deposit|payment|money in/i), amtC = -1;
  if (debitC < 0 || share(debitC, isNum) === 0){ debitC = -1; amtC = by(/amount|cad\$?|value/i); if (amtC < 0) for (let k = head.length - 1; k >= 0; k--) if (k !== dC && share(k, isNum) > .6){ amtC = k; break; } }
  const textCols = head.map((_, k) => k).filter(k => k !== dC && k !== amtC && k !== debitC && k !== creditC && share(k, v => /[a-z]{3}/i.test(v || '')) > .5);
  if (dC < 0 || (amtC < 0 && debitC < 0)){ toast('Couldn\'t find the date and amount columns in that file.'); return; }
  // With one amount column, purchases are whichever sign most rows have (negative for bank accounts, positive for many card exports).
  const negs = amtC >= 0 ? body.filter(r => parseMoney(r[amtC]) < 0).length : 0, purchNeg = amtC >= 0 && negs > body.length / 2;
  const items = [];
  body.forEach(r => {
    const date = parseAnyDate(r[dC]); if (!date) return;
    let a = debitC >= 0 ? parseMoney(r[debitC]) : parseMoney(r[amtC]); if (!isFinite(a) || !a) return;
    if (debitC >= 0) a = Math.abs(a); else if (purchNeg){ if (a > 0) return; a = -a; } else { if (a < 0) return; }
    const desc = textCols.map(k => String(r[k] || '').trim()).filter(Boolean).join(' ').replace(/\s+/g, ' ').slice(0, 60);
    const cat = window.TaxKeepOCR ? TaxKeepOCR.guessCategory(desc, isSelf()) : null;
    const key = ['stmt', date, a.toFixed(2), desc].join('|');
    if (receipts.some(x => x.key === key)) return;
    items.push({ date, amount: Math.round(a * 100) / 100, desc, cat, key, pick: !!cat && cat !== 'b_meals' });
  });
  const cats = isSelf() ? [...personalCats(), ...BUSINESS] : personalCats();
  const allowedCat = new Set(cats.map(c => c[0]));

function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const delim = [',', ';', '\t'].sort((a, b) => first.split(b).length - first.split(a).length)[0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === delim){ row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}
function parseMoney(v){
  let t = String(v || '').trim(); if (!t) return NaN;
  const neg = /^\(.*\)$/.test(t) || /^-/.test(t.replace(/[\s$]|CAD|CA/g, '')) || /-$/.test(t);
  t = t.replace(/[^0-9.,]/g, '');
  if (/,\d{2}$/.test(t) && !/\.\d{2}$/.test(t)) t = t.replace(/\./g, '').replace(',', '.'); else t = t.replace(/,/g, '');
  const n = parseFloat(t); return isFinite(n) ? (neg ? -n : n) : NaN;
}
function parseAnyDate(v){
  const t = String(v || '').trim(); if (!t) return null;
  let m = t.match(/(20\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  m = t.match(/\b(\d{1,2})[\/.-](\d{1,2})[\/.-](20\d{2}|\d{2})\b/);
  if (m){ let a = +m[1], b = +m[2], y = +m[3]; if (y < 100) y += 2000; let mo = a, d = b; if (a > 12){ mo = b; d = a; } if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31) return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`; }
  const ms = Date.parse(t.replace(/(\d)(st|nd|rd|th)\b/, '$1'));
  if (isFinite(ms)){ const d = new Date(ms); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
  return null;
}
async function importCSV(file){
  let rows;
  try { rows = parseCSV(await file.text()); } catch(e){ toast('Could not read that file.'); return; }
  if (rows.length < 2){ toast('That file has no rows to import.'); return; }
  const head = rows[0].map(h => String(h).trim()), body = rows.slice(1, 5001);
  const numericShare = c => body.filter(r => isFinite(parseMoney(r[c]))).length / body.length;
  const dateShare = c => body.filter(r => parseAnyDate(r[c])).length / body.length;
  const find = (re, ok) => { let i = head.findIndex((h, k) => re.test(h) && ok(k)); return i; };
  let dC = find(/date|time|day|period|week|paid|payout/i, k => dateShare(k) > 0.6);
  if (dC < 0) dC = head.findIndex((h, k) => dateShare(k) > 0.6);
  let aC = find(/^net|net (pay|earnings|payout|amount)|total (pay|earnings|payout)|payout|earnings|amount|total|pay/i, k => numericShare(k) > 0.6 && k !== dC);
  if (aC < 0) for (let k = head.length - 1; k >= 0; k--) if (k !== dC && numericShare(k) > 0.6){ aC = k; break; }
  let sC = -1;
  for (const re of [/desc/i, /memo|details|note/i, /activity|trip|type|category/i]){ sC = find(re, k => k !== dC && k !== aC); if (sC >= 0) break; }
  const blob = (file.name + ' ' + head.join(' ')).toLowerCase();
  const plat = /uber ?eats/.test(blob) ? 'Uber Eats' : /uber/.test(blob) ? 'Uber' : /doordash|dasher/.test(blob) ? 'DoorDash' : /skip/.test(blob) ? 'SkipTheDishes' : /instacart/.test(blob) ? 'Instacart' : /lyft/.test(blob) ? 'Lyft' : 'Other';
  const opts = (sel, none) => (none ? `<option value="-1">${none}</option>` : '') + head.map((h, i) => `<option value="${i}" ${i === sel ? 'selected' : ''}>${esc(h || 'Column ' + (i + 1))}</option>`).join('');
  openSheet(`<h3>Import earnings</h3><p class="small muted">${esc(file.name)} · ${body.length} rows. Check that the columns are right.</p>
    <div class="map"><label class="small">App</label><select id="cP">${PLATFORMS.map(x => `<option ${x === plat ? 'selected' : ''}>${x}</option>`).join('')}</select>
    <label class="small">Date column</label><select id="cD">${opts(dC)}</select>
    <label class="small">Amount you were paid</label><select id="cA">${opts(aC)}</select>
    <label class="small">Description (optional)</label><select id="cS">${opts(sC, 'None')}</select></div>
    <div id="cPrev" style="margin-top:12px"></div>
    <div class="row" style="margin-top:14px"><button class="btn sec" style="flex:1" data-act="close">Cancel</button><button class="btn" style="flex:1" id="cGo">Import</button></div>`);
  let parsed = [];
  const build = () => {
    const d = +$('#cD').value, a = +$('#cA').value, sc = +$('#cS').value, pl = $('#cP').value;
    parsed = []; let bad = 0, dup = 0, nonPos = 0;
    body.forEach(r => {
      const date = parseAnyDate(r[d]), amt = parseMoney(r[a]);
      if (!date || !isFinite(amt)){ bad++; return; }
      if (amt <= 0){ nonPos++; return; }
      const desc = sc >= 0 ? String(r[sc] || '').trim().slice(0, 60) : '';
      const key = [pl, date, amt.toFixed(2), desc].join('|');
      if (state.income.some(i => i.key === key) || parsed.some(i => i.key === key)){ dup++; return; }
      parsed.push({ id:newId(), year:Number(date.slice(0, 4)), date, type:'self', client: pl + (desc ? ' – ' + desc : ''), amount:Math.round(amt * 100) / 100, tax:0, gst:0, key, imported:true });
    });
    const total = sum(parsed.map(x => x.amount)), years = [...new Set(parsed.map(x => x.year))].sort();
    $('#cPrev').innerHTML = `<div class="scan ${parsed.length ? 'ok' : 'warn'}">${parsed.length ? `Ready to import <b>&nbsp;${parsed.length}&nbsp;</b> payments, ${money(total)} (${years.join(', ')})` : 'No payments found with these columns.'}</div>
      ${(bad || dup || nonPos) ? `<p class="small muted">Skipped: ${[bad && bad + ' rows without a date or amount', nonPos && nonPos + ' zero or negative rows', dup && dup + ' already imported'].filter(Boolean).join(', ')}.</p>` : ''}
      ${parsed.length ? `<table class="preview-t">${parsed.slice(0, 4).map(x => `<tr><td>${x.date}</td><td>${esc(x.client)}</td><td style="text-align:right">${money(x.amount)}</td></tr>`).join('')}</table>` : ''}`;
    $('#cGo').disabled = !parsed.length;
  };
  ['#cP','#cD','#cA','#cS'].forEach(id => $(id).onchange = build); build();
  $('#cGo').onclick = () => {
    state.income = state.income.concat(parsed);
    const turnedOn = !has('gig'); if (turnedOn) setKind('gig', true);
    const yrs = parsed.map(x => x.year); if (yrs.length && !yrs.includes(Y())) state.profile.year = Math.max(...yrs);
    closeSheet(); persist(); tab = 'income'; render();
    toast(`Imported ${parsed.length} payments` + (turnedOn ? '. Gig tools are now on.' : ''));
  };
}

function csv(rows){ return rows.map(r => r.map(c => { const s = String(c ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\r\n'); }

function uniquePath(used, path){ if (!used.has(path)){ used.add(path); return path; } const i = path.lastIndexOf('.'); let n = 2, p; do { p = `${path.slice(0, i)} (${n++})${path.slice(i)}`; } while (used.has(p)); used.add(p); return p; }
function docFolders(usedKeys){

  const order = [['slips', 'Tax slips']].concat(PERSONAL.map(([k, l]) => [k, l]), BUSINESS.map(([k, l]) => [k, 'Business - ' + l]), [['other', 'Other']]);

// Phones don't preview SVG well; turn drawings (sample receipts) into PNG.
function svgToPng(f){
  return new Promise(res => { const im = new Image(); im.onload = () => { const c = document.createElement('canvas'); c.width = im.width * 2 || 600; c.height = im.height * 2 || 800;
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height); res({ name: f.name.replace(/\.svg$/i, '.png'), type:'image/png', dataUrl: c.toDataURL('image/png') }); };
    im.onerror = () => res(f); im.src = f.dataUrl; });
}

    case 'cDelete': confirmSheet('Delete your cloud backup?', 'This deletes your account and every backed-up record and photo from the cloud. It can\'t be undone. Records on this phone stay.', 'Delete forever', async () => { try { await TaxKeepCloud.deleteAll(); toast('Cloud backup deleted'); } catch(e){ toast(e.message); } render(); }); break;
    case 'allAlerts': showAllAlerts = !showAllAlerts; render(); break;
    case 'goAbout': tab = 'more'; moreSec = 'about'; render(); window.scrollTo(0, 0); break;
    case 'goQuestions': questionsSheet(); break;
    case 'goSlips': tab = 'checklist'; formsSeg = 'slips'; render(); window.scrollTo(0, 0); break;
    case 'moreHome': tab = 'more'; moreSec = ''; render(); window.scrollTo(0, 0); break;
    case 'stmt': closeSheet(); pickFile('.csv,text/csv,text/plain', importStatement); break;
    case 'gigCsv': closeSheet(); pickFile('.csv,text/csv,text/plain', importCSV); break;
    case 'wipe': confirmSheet('Delete everything?', 'All receipts, files and answers in this storage will be permanently removed.', 'Delete all', wipe); break;
    case 'addContrib': simpleForm('Add RRSP / TFSA / FHSA entry', [
        { id:'acct', label:'Account', type:'select', opts:[['rrsp','RRSP'],['tfsa','TFSA'],['fhsa','FHSA']] },
        { id:'type', label:'Type', type:'select', opts:[['contrib','Contribution'],['withdraw','Withdrawal (TFSA)']] },
        { id:'date', label:'Date', type:'date', value:today() }, { id:'amount', label:'Amount ($)', type:'number', ph:'0.00' }],
      v => { if (!num(v.amount)){ toast('Enter an amount'); return false; } state.room.contribs.push({ id:newId(), year:Y(), acct:v.acct, type:v.type, date:v.date, amount:num(v.amount) }); }); break;
    case 'addIncome': incomeForm(null); break;
    case 'incomeAll': incomeShowAll = true; render(); break;
    case 'lockNow': if (window.TaxKeepLock) TaxKeepLock.lockNow(); break;
    case 'testRem': if (!window.TaxKeepReminders || !TaxKeepReminders.available()){ toast('Reminders work in the installed Android app.'); break; }
      TaxKeepReminders.test().then(r => toast(r.ok ? 'A test reminder will pop up in 5 seconds.' : 'Notifications are blocked. Turn them on in Settings → Apps → TaxKeep.')); break;
    case 'addTrip': simpleForm('Log a business trip', [
        { id:'date', label:'Date', type:'date', value:today() }, { id:'purpose', label:'Purpose / destination', ph:'e.g. Client site, deliveries' },
        { id:'km', label:'Kilometres', type:'number', ph:'0' }],
      v => { if (!num(v.km)){ toast('Enter the km'); return false; } state.mileage.push({ id:newId(), year:Y(), date:v.date, purpose:v.purpose, km:num(v.km) }); }); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if (d.act === 'year'){ state.profile.year = Number(t.value); persist(); render(); }
  else if (d.doc){ state.docsDone[d.doc] = t.checked; persist(); render(); }
  else if (d.room !== undefined){ state.room[d.room] = t.value; persist(); render(); }
  else if (t.hasAttribute('data-fhsa')){ state.room.fhsaOpen = t.checked; persist(); render(); }
  else if (t.hasAttribute('data-totalkm')){ state.totalKm[Y()] = t.value; persist(); render(); }
  else if (d.prof){ state.profile[d.prof] = t.value; persist(); render(); }
  else if (t.hasAttribute('data-cauto')){ state.cloudAuto = t.checked; persist(); if (t.checked) scheduleBackup(); }
  else if (d.kind){ setKind(d.kind, t.checked); persist(); render(); if (state.reminders.on) syncReminders(); }
  else if (t.id === 'noaIn'){ const f = t.files && t.files[0]; window.__tkPauseLock = false; if (f) readNOA(f); t.value = ''; }
  else if (t.id === 'stmtIn'){ const f = t.files && t.files[0]; window.__tkPauseLock = false; if (f) importStatement(f); t.value = ''; }
  else if (d.gst){ state.gst[d.gst] = t.type === 'checkbox' ? t.checked : t.value; persist(); render(); if (state.reminders.on) syncReminders(); }
  else if (d.hh){ state.household[d.hh] = t.type === 'checkbox' ? t.checked : t.value; persist(); render(); }
  else if (t.id === 'csvIn'){ const f = t.files && t.files[0]; window.__tkPauseLock = false; if (f) importCSV(f); t.value = ''; }
  else if (d.wait){ state.waitlist[d.wait] = t.checked; persist(); }
  else if (d.rem){ if (!state.reminders.on){ state.reminders = { on:true, deadlines:false, instalments:false, monthly:false }; } state.reminders[d.rem] = t.checked; persist(); syncReminders().then(render); render(); }
  else if (t.hasAttribute('data-lock')){
    if (!window.TaxKeepLock) return;
    if (t.checked) TaxKeepLock.setupPin().then(ok => { toast(ok ? 'PIN lock is on' : 'PIN not set'); render(); });
    else TaxKeepLock.verify().then(ok => { if (ok){ TaxKeepLock.turnOff(); toast('Lock turned off'); } render(); });
  }
  else if (t.hasAttribute('data-bio')){ TaxKeepLock.setBio(t.checked).then(ok => { if (!ok && t.checked) toast('No fingerprint is set up on this phone.'); render(); }); }
  else if (d.act === 'pct'){ state.setAsidePct = Number(t.value); persist(); render(); }
});
document.addEventListener('input', e => { if (e.target.dataset.act === 'pct'){ const b = e.target.nextElementSibling; if (b) b.textContent = e.target.value + '%'; } });

/* ---------------- start ---------------- */
(async () => {
  let pref = 'device'; try { pref = localStorage.getItem('taxkeep_mode') || 'device'; } catch(e){}
  if (pref === 'cloud'){ const c = await makeCloudStore().catch(() => null); if (c){ store = c; cloudOK = true; } }
  if (!store) store = await makeDeviceStore();
try { const AppP = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.App;
  if (AppP) AppP.addListener('backButton', () => {
    if (document.getElementById('lockScreen') && document.getElementById('lockScreen').offsetParent) { AppP.exitApp(); return; }
    if ($('#modal').classList.contains('open')){ closeSheet(); return; }
    if (tab === 'more' && moreSec){ moreSec = ''; render(); return; }
    if (tab === 'accounts'){ tab = 'more'; render(); return; }
    if (tab !== 'home'){ tab = 'home'; render(); window.scrollTo(0, 0); return; }
    AppP.exitApp();
  });
} catch(e){}
  try { if (window.TaxKeepLock) TaxKeepLock.init(); } catch(e){}
  await loadAll();
  if (!state.onboarded && (receipts.length || state.income.length || Object.keys(state.answers).length)){ state.onboarded = true; persist(); }
  render();
  if (!state.onboarded) showOnboarding(); else if (state.reminders.on) syncReminders();
  capUse('downloads').then(x => { dl = x; if (tab === 'more') render(); });
  // Cloud backup: restore the saved session, back up after receipt changes.
  ['putReceipt','deleteReceipt'].forEach(k => { const f = store[k]; store[k] = async x => { const r = await f(x); scheduleBackup(); return r; }; });
  if (window.TaxKeepCloud){ TaxKeepCloud.onChange(() => render()); TaxKeepCloud.init().then(u => { render(); if (u) scheduleBackup(); }).catch(() => {}); }
  if (cloudOK === null) makeCloudStore().then(c => { cloudOK = !!c; if (tab === 'more') render(); }).catch(() => { cloudOK = false; });
})();
</script>

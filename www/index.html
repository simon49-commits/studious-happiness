<script>
/* App shim: TaxKeep's export asks for a "downloads" capability. In the Android app,
   that is provided by saving the ZIP to the app's cache and opening Android's share sheet. */
window.claude = { use: async function(name){
  if (name !== 'downloads') return null;
  var P = window.Capacitor && window.Capacitor.Plugins;
  if (!P || !P.Filesystem || !P.Share) return null;
  return { save: async function(opts){
    var b64 = await new Promise(function(res, rej){ var r = new FileReader(); r.onload = function(){ res(String(r.result).split(',')[1]); }; r.onerror = rej; r.readAsDataURL(opts.data); });
    var w = await P.Filesystem.writeFile({ path: opts.filename, data: b64, directory: 'CACHE' });
    try {
      await P.Share.share({ title: opts.filename, files: [w.uri], dialogTitle: 'Save or send your tax package' });
    } catch (e) {
      var m = String((e && e.message) || e);
      if (/cancel/i.test(m)) { var err = new Error('cancelled'); err.code = 'declined'; throw err; }
      throw e;
    }
  }};
}};
</script>
<style>

<body>
<div id="app">
  <header>
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="var(--brand)"/><path d="M8 9h12M8 14h12M8 19h7" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="20" cy="19" r="2.4" fill="#fff"/></svg>
      TaxKeep
    </div>
    <span class="badge" id="modeBadge">Loading…</span>
  </header>
  <main id="view"><div class="empty"><span class="spin"></span> Loading your records…</div></main>
</div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>

<script>
/* ---------------- constants ---------------- */
const PERSONAL = [
  ['medical','Medical & dental'],['donations','Donations'],['childcare','Childcare'],['moving','Moving'],
  ['tuition','Tuition & education'],['disability','Disability-related'],['accessibility','Home accessibility'],
  ['dues','Union & professional dues'],['employment','Employment expenses'],['rent','Rent / property tax'],['otherp','Other personal']];
const BUSINESS = [
  ['b_adv','Advertising'],['b_meals','Meals & entertainment'],['b_office','Office expenses'],['b_supplies','Supplies'],
  ['b_fees','Legal & accounting fees'],['b_rent','Business rent'],['b_repairs','Repairs & maintenance'],['b_phone','Phone & internet'],
  ['b_travel','Travel'],['b_vehicle','Vehicle (fuel, repairs, insurance)'],['b_home','Business-use-of-home'],['b_ins','Insurance'],['b_other','Other business']];
const ALLCATS = Object.fromEntries([...PERSONAL,...BUSINESS]);
const QUESTIONS = [
  {id:'employed',q:'Did you work for an employer this year?',docs:['T4 slip from each employer']},
  {id:'wfh',q:'Did your employer require you to work from home or pay your own work costs?',docs:['T2200 or T2200S from your employer','Receipts for work expenses'],cat:'employment'},
  {id:'invest',q:'Did you earn bank interest or investment income?',docs:['T5 / T3 slips','T5008 for investments you sold']},
  {id:'rrsp',q:'Did you contribute to an RRSP?',docs:['RRSP contribution receipts (incl. first 60 days of next year)']},
  {id:'fhsa',q:'Do you have a First Home Savings Account (FHSA)?',docs:['T4FHSA slip']},
  {id:'student',q:'Did you pay tuition or attend post-secondary school?',docs:['T2202 tuition slip'],cat:'tuition'},
  {id:'kids',q:'Did you pay for daycare, before/after-school care or day camps?',docs:["Childcare receipts showing the provider's name and SIN or business number"],cat:'childcare'},
  {id:'medical',q:'Did you pay for prescriptions, dental, glasses or other medical costs not covered by insurance?',docs:['Medical and dental receipts','Insurance claim statements'],cat:'medical'},
  {id:'donate',q:'Did you donate to registered charities?',docs:['Official donation receipts'],cat:'donations'},
  {id:'moved',q:'Did you move at least 40 km closer to a new job or school?',docs:['Moving receipts (movers, travel, temporary lodging)'],cat:'moving'},
  {id:'benefits',q:'Did you receive EI, a pension, or RRSP/RRIF withdrawals?',docs:['T4E (EI)','T4A / T4A(P) / T4A(OAS)','T4RSP / T4RIF']},
  {id:'disab',q:'Do you or a dependant have (or plan to apply for) the disability tax credit?',docs:['T2201 approval letter or form'],cat:'disability'},
  {id:'renter',q:'Did you pay rent or property tax? (some provincial credits use it)',docs:['Rent receipts or property tax statement'],cat:'rent'},
  {id:'self',q:'Did you have self-employment or gig income (Uber, DoorDash, freelance, contracting)?',docs:['Income records and any T4A slips','Business receipts','GST/HST records (if registered)','Vehicle mileage log']},
];
const INCOME_TYPES = [['employment','Job (T4)'],['self','Self-employed / gig'],['benefits','EI, pension & benefits'],['invest','Interest & investments'],['rental','Rental'],['other','Other']];
const INCOME_LABEL = Object.fromEntries(INCOME_TYPES);
const PLATFORMS = ['Uber','Uber Eats','DoorDash','SkipTheDishes','Instacart','Lyft','Other'];
const CLOUD_MAX = 230000; // chars of data URL that fit in one cloud document

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const money = n => new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(n || 0);
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const sum = a => a.reduce((x, y) => x + (num(y)), 0);
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const catLabel = c => ALLCATS[c] || 'Other';
const isBiz = c => String(c).startsWith('b_');
const safeName = s => String(s || 'item').replace(/[^a-z0-9\-_ ]/gi, '').trim().replace(/\s+/g, '_').slice(0, 40) || 'item';
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200); }
function capUse(name){ try { return (window.claude && typeof window.claude.use === 'function') ? window.claude.use(name).catch(() => null) : Promise.resolve(null); } catch(e){ return Promise.resolve(null); } }

/* ---------------- storage: device (IndexedDB) ---------------- */
function idbOpen(){
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open('taxkeep', 1);
      r.onupgradeneeded = () => { const d = r.result; ['kv','receipts','files'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); }); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    } catch(e){ rej(e); }
  });
}
function idbDo(d, name, mode, fn){
  return new Promise((res, rej) => {
    const tx = d.transaction(name, mode); const rq = fn(tx.objectStore(name));
    tx.oncomplete = () => res(rq ? rq.result : undefined); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  });
}
function makeMemoryStore(){
  const kv = new Map(), rc = new Map(), fl = new Map();
  return { kind:'memory', label:'Temporary (not saved)',
    loadState: async () => kv.get('state'), saveState: async s => { kv.set('state', JSON.parse(JSON.stringify(s))); },
    listReceipts: async () => [...rc.values()], putReceipt: async m => { rc.set(m.id, {...m}); }, deleteReceipt: async id => { rc.delete(id); },
    getFile: async id => fl.get(id), putFile: async (id, f) => { fl.set(id, f); }, deleteFile: async id => { fl.delete(id); } };
}
async function makeDeviceStore(){
  try {
    const d = await idbOpen();
    return { kind:'device', label:'On this device',
      loadState: () => idbDo(d,'kv','readonly', os => os.get('state')),
      saveState: s => idbDo(d,'kv','readwrite', os => os.put(JSON.parse(JSON.stringify(s)), 'state')),
      listReceipts: () => idbDo(d,'receipts','readonly', os => os.getAll()),
      putReceipt: m => idbDo(d,'receipts','readwrite', os => os.put({...m}, m.id)),
      deleteReceipt: id => idbDo(d,'receipts','readwrite', os => os.delete(id)),
      getFile: id => idbDo(d,'files','readonly', os => os.get(id)),
      putFile: (id, f) => idbDo(d,'files','readwrite', os => os.put(f, id)),
      deleteFile: id => idbDo(d,'files','readwrite', os => os.delete(id)) };
  } catch(e){ return makeMemoryStore(); }
}

/* ---------------- storage: cloud vault (artifact db, private per person) ---------------- */
async function makeCloudStore(){
  const [db, user] = await Promise.all([capUse('db'), capUse('user')]);
  if (!db || !user) return null;
  let uid = null; try { uid = await user.id(); } catch(e){}
  if (!uid) return null;
  const vault = db.doc('data/users/' + uid + '/vault');
  const stateDoc = db.doc('data/users/' + uid + '/state');
  const rc = vault.collection('receipts'), fc = vault.collection('files');
  return { kind:'cloud', label:'Cloud vault',
    loadState: async () => { const s = await stateDoc.get(); return s.exists ? JSON.parse(JSON.stringify(s.data())) : undefined; },
    saveState: s => stateDoc.set(JSON.parse(JSON.stringify(s))),
    listReceipts: async () => { const q = await rc.limit(1000).get(); return q.docs.map(d => ({...d.data()})); },
    putReceipt: m => rc.doc(m.id).set({...m}),
    deleteReceipt: id => rc.doc(id).delete(),
    getFile: async id => { const s = await fc.doc(id).get(); return s.exists ? {...s.data()} : undefined; },
    putFile: (id, f) => fc.doc(id).set({...f}),
    deleteFile: id => fc.doc(id).delete() };
}

/* ---------------- images ---------------- */
function readFile(file){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(file); }); }
function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function shrinkImage(dataUrl, maxChars, maxDim){
  const img = await loadImg(dataUrl);
  let dim = Math.min(maxDim, Math.max(img.width, img.height)), q = 0.82, out = dataUrl;
  for (let i = 0; i < 9; i++){
    const s = dim / Math.max(img.width, img.height);
    const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    out = c.toDataURL('image/jpeg', q);
    if (out.length <= maxChars) return out;
    dim *= 0.82; q = Math.max(0.5, q - 0.07);
  }
  return out.length <= maxChars ? out : null;
}
async function fitFor(kind, f){
  if (!f) return f;
  const limit = kind === 'cloud' ? CLOUD_MAX : 6000000;
  if (f.dataUrl.length <= limit) return f;
  if (/^image\/(jpeg|png|webp|gif|heic|heif|bmp)/.test(f.type)){
    const s = await shrinkImage(f.dataUrl, limit, kind === 'cloud' ? 1600 : 3000).catch(() => null);
    return s ? {...f, type:'image/jpeg', dataUrl:s, name:f.name.replace(/\.\w+$/, '') + '.jpg'} : null;
  }
  return null;
}
function extFor(f){ const m = { 'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif','image/svg+xml':'svg','application/pdf':'pdf' }; return m[f.type] || (f.name.split('.').pop() || 'bin'); }

/* ---------------- calculations ---------------- */
function room(){
  const c = state.room.contribs.filter(x => x.year === Y());
  const s = (a, t) => sum(c.filter(x => x.acct === a && x.type === t).map(x => x.amount));
  const rr = { limit:num(state.room.rrspLimit), set:state.room.rrspLimit !== '', used:s('rrsp','contrib') };
  rr.left = rr.limit - rr.used; rr.over = Math.max(0, rr.used - rr.limit); rr.penal = Math.max(0, rr.over - 2000);
  const tf = { limit:num(state.room.tfsaRoom), set:state.room.tfsaRoom !== '', used:s('tfsa','contrib'), wd:s('tfsa','withdraw') };
  tf.left = tf.limit - tf.used; tf.over = Math.max(0, -tf.left);
  const fh = { open:!!state.room.fhsaOpen, limit:8000 + Math.min(8000, num(state.room.fhsaCarry)), used:s('fhsa','contrib'), prior:num(state.room.fhsaPrior) };
  fh.left = fh.limit - fh.used; fh.over = Math.max(0, -fh.left); fh.life = 40000 - fh.prior - fh.used;
  return { rr, tf, fh };
}
function biz(){
  const inc = state.income.filter(x => x.year === Y() && x.type === 'self'), mil = state.mileage.filter(x => x.year === Y());
  const rs = yearReceipts().filter(r => isBiz(r.category));
  const income = sum(inc.map(x => x.amount)), gst = sum(inc.map(x => x.gst));
  const bizKm = sum(mil.map(x => x.km)), totalKm = num(state.totalKm[Y()]);
  const usePct = totalKm > 0 ? Math.min(1, bizKm / totalKm) : null;
  let exp = 0;
  rs.forEach(r => { let a = num(r.amount); if (r.category === 'b_meals') a *= 0.5; if (r.category === 'b_vehicle' && usePct !== null) a *= usePct; exp += a; });
  const net = income - exp, setAside = Math.max(0, net) * num(state.setAsidePct) / 100;
  return { inc, mil, rs, income, gst, bizKm, totalKm, usePct, exp, net, setAside };
}
function nextInstalment(){
  const d = new Date(), y = d.getFullYear();
  const dates = [[2,15],[5,15],[8,15],[11,15]].map(([m, day]) => new Date(y, m, day)).concat([new Date(y + 1, 2, 15)]);
  return dates.find(x => x >= new Date(d.getFullYear(), d.getMonth(), d.getDate()));
}
function alerts(){
  const out = [], rs = yearReceipts(), unanswered = QUESTIONS.filter(q => !state.answers[q.id]).length;
  if (unanswered) out.push(['info', `Answer ${unanswered} quick question${unanswered > 1 ? 's' : ''} so we know which slips and receipts you need.`, 'checklist']);
  QUESTIONS.forEach(q => { if (q.cat && state.answers[q.id] === 'yes' && !rs.some(r => r.category === q.cat)) out.push(['warn', `You said yes to "${q.q.replace(/\?.*$/, '?')}" but haven't added any ${catLabel(q.cat).toLowerCase()} receipts yet.`, 'receipts']); });
  const R = room();
  if (R.rr.set && R.rr.penal > 0) out.push(['bad', `RRSP: you're ${money(R.rr.over)} over your limit. CRA charges 1% a month on the amount over the $2,000 buffer.`, 'accounts']);
  else if (R.rr.set && R.rr.over > 0) out.push(['warn', `RRSP: ${money(R.rr.over)} over your limit, still inside the $2,000 buffer. Don't add more.`, 'accounts']);
  if (R.tf.set && R.tf.over > 0) out.push(['bad', `TFSA: ${money(R.tf.over)} over your room. CRA charges 1% a month on the excess.`, 'accounts']);
  if (R.fh.open && R.fh.over > 0) out.push(['bad', `FHSA: ${money(R.fh.over)} over this year's participation room.`, 'accounts']);
  if (state.profile.selfEmployed){
    const n = nextInstalment(); out.push(['info', `Next CRA instalment date: ${n.toLocaleDateString('en-CA',{month:'long',day:'numeric',year:'numeric'})} (only if CRA asked you to pay instalments).`, 'income']);
    if (!state.mileage.some(m => m.year === Y())) out.push(['warn', 'No business trips logged this year. CRA expects a mileage log to claim vehicle costs.', 'income']);
  }
  if (store && store.kind !== 'cloud' && receipts.length && (!state.lastExport || Date.now() - state.lastExport > 60 * 864e5)) out.push(['warn', 'Your records live only on this device. Export a backup copy so a lost phone doesn’t mean lost receipts.', 'more']);
  if (store && store.kind === 'memory') out.push(['bad', 'This device blocked on-device storage, so nothing will be kept after you close the app.', 'more']);
  return out;
}

/* ---------------- modal ---------------- */
function openSheet(html){ $('#sheet').innerHTML = html; $('#modal').classList.add('open'); }
function closeSheet(){ $('#modal').classList.remove('open'); $('#sheet').innerHTML = ''; }
function confirmSheet(title, body, okLabel, onOk){
  openSheet(`<h3>${esc(title)}</h3><p class="muted">${esc(body)}</p><div class="row"><button class="btn sec" style="flex:1" data-act="close">Cancel</button><button class="btn danger" style="flex:1" id="okBtn">${esc(okLabel)}</button></div>`);
  $('#okBtn').onclick = async () => { closeSheet(); await onOk(); };
}
let pendingFile = null;
function receiptForm(r){
  pendingFile = null;
  const cats = state.profile.selfEmployed ? [['Personal credits', PERSONAL], ['Business (T2125)', BUSINESS]] : [['Personal credits', PERSONAL]];
  openSheet(`
    <h3>${r ? 'Edit receipt' : 'Add receipt'}</h3>
    ${r ? '' : `<label class="drop" id="drop"><input type="file" id="fileIn" accept="image/*,application/pdf" hidden><div id="dropTxt">📷 Tap to take a photo or choose an image / PDF</div></label>`}
    <div id="prev"></div>
    <label class="f">Store or payee</label><input type="text" id="fVendor" value="${esc(r ? r.vendor : '')}" placeholder="e.g. Shoppers Drug Mart">
    <div class="grid2"><div><label class="f">Date</label><input type="date" id="fDate" value="${esc(r ? r.date : today())}"></div>
    <div><label class="f">Amount ($)</label><input type="number" inputmode="decimal" step="0.01" id="fAmt" value="${r ? esc(r.amount) : ''}" placeholder="0.00"></div></div>
    <label class="f">Category</label><select id="fCat">${cats.map(([g, l]) => `<optgroup label="${g}">${l.map(([k, n]) => `<option value="${k}" ${r && r.category === k ? 'selected' : ''}>${esc(n)}</option>`).join('')}</optgroup>`).join('')}</select>
    <label class="f">Note (optional)</label><textarea id="fNote" placeholder="Who it was for, what it covered…">${esc(r ? r.note : '')}</textarea>
    <div class="row" style="margin-top:14px">${r ? `<button class="btn danger" data-delreceipt="${r.id}">Delete</button>` : ''}<button class="btn sec" style="flex:1" data-act="close">Cancel</button><button class="btn" style="flex:1" id="saveR">Save</button></div>`);
  const fi = $('#fileIn');
  if (fi) fi.onchange = async () => {
    const file = fi.files[0]; if (!file) return;
    $('#dropTxt').textContent = 'Reading…';
    try {
      let f = { name:file.name, type:file.type || 'application/octet-stream', dataUrl:await readFile(file) };
      const fit = await fitFor(store.kind, f);
      if (!fit){ $('#dropTxt').textContent = store.kind === 'cloud' ? 'That PDF is too big for the cloud vault in this prototype. Use a photo or switch to on-device storage.' : 'That file is too large.'; return; }
      pendingFile = fit;
      $('#drop').classList.add('has'); $('#dropTxt').textContent = '✓ ' + file.name + (fit !== f ? ' (resized)' : '');
      $('#prev').innerHTML = /^image/.test(fit.type) ? `<img class="preview" src="${fit.dataUrl}" alt="Receipt preview">` : '';
      if (/^image\/(jpeg|png|webp|gif|bmp)/.test(fit.type) && window.TaxKeepOCR) autoFill(fit.dataUrl);
    } catch(e){ $('#dropTxt').textContent = 'Could not read that file.'; }
    window.__tkPauseLock = false;
  };
  $('#fCat').addEventListener('change', () => { $('#fCat').dataset.touched = '1'; });
  if (!r && window.TaxKeepOCR) TaxKeepOCR.warmUp();
  $('#saveR').onclick = async () => {
    const amt = num($('#fAmt').value), date = $('#fDate').value;
    if (!date){ toast('Add a date'); return; }
    const m = r ? {...r} : { id:newId(), hasFile:false, created:Date.now() };
    Object.assign(m, { vendor:$('#fVendor').value.trim(), date, amount:amt, category:$('#fCat').value, note:$('#fNote').value.trim() });
    $('#saveR').disabled = true;
    try {
      if (pendingFile){ await store.putFile(m.id, pendingFile); m.hasFile = true; m.fileType = pendingFile.type; m.fileName = pendingFile.name; }
      await store.putReceipt(m);
      receipts = receipts.filter(x => x.id !== m.id).concat(m).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      closeSheet(); toast('Saved'); render();
    } catch(e){ $('#saveR').disabled = false; toast('Could not save: ' + (e && (e.message || e.code) || 'error')); }
  };
}
function autoFill(dataUrl){
  const box = document.createElement('div'); box.className = 'scan'; box.innerHTML = '<span class="spin"></span><span id="ocrMsg">Reading your receipt…</span>';
  $('#prev').appendChild(box);
  window.__ocrProgress = p => { const m = document.getElementById('ocrMsg'); if (m) m.textContent = `Reading your receipt… ${Math.round(p * 100)}%`; };
  TaxKeepOCR.readReceipt(dataUrl, state.profile.selfEmployed).then(r => {
    if (!box.isConnected) return;
    const got = [];
    if (r.vendor && !$('#fVendor').value.trim()){ $('#fVendor').value = r.vendor; got.push('store'); }
    if (r.date && (!$('#fDate').value || $('#fDate').value === today())){ $('#fDate').value = r.date; got.push('date'); }
    if (r.total && !$('#fAmt').value){ $('#fAmt').value = r.total.toFixed(2); got.push('total'); }
    if (r.category && !$('#fCat').dataset.touched && $('#fCat').querySelector(`option[value="${r.category}"]`)){ $('#fCat').value = r.category; got.push('category'); }
    box.className = got.length ? 'scan ok' : 'scan warn';
    box.textContent = got.length ? `✓ Filled in the ${got.join(', ')} from your photo. Please check them.` : 'Couldn\'t read this receipt clearly. Please fill it in.';
  }).catch(() => { if (box.isConnected){ box.className = 'scan warn'; box.textContent = 'Couldn\'t read this receipt. Please fill it in.'; } });
}

  }
}

function parseCSV(text){
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const delim = [',', ';', '\t'].sort((a, b) => first.split(b).length - first.split(a).length)[0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i + 1] === '"'){ cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === delim){ row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}
function parseMoney(v){
  let t = String(v || '').trim(); if (!t) return NaN;
  const neg = /^\(.*\)$/.test(t) || /^-/.test(t.replace(/[\s$]|CAD|CA/g, '')) || /-$/.test(t);
  t = t.replace(/[^0-9.,]/g, '');
  if (/,\d{2}$/.test(t) && !/\.\d{2}$/.test(t)) t = t.replace(/\./g, '').replace(',', '.'); else t = t.replace(/,/g, '');
  const n = parseFloat(t); return isFinite(n) ? (neg ? -n : n) : NaN;
}
function parseAnyDate(v){
  const t = String(v || '').trim(); if (!t) return null;
  let m = t.match(/(20\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  m = t.match(/\b(\d{1,2})[\/.-](\d{1,2})[\/.-](20\d{2}|\d{2})\b/);
  if (m){ let a = +m[1], b = +m[2], y = +m[3]; if (y < 100) y += 2000; let mo = a, d = b; if (a > 12){ mo = b; d = a; } if (mo >= 1 && mo <= 12 && d >= 1 && d <= 31) return `${y}-${String(mo).padStart(2, '0')}-${String(d).padStart(2, '0')}`; }
  const ms = Date.parse(t.replace(/(\d)(st|nd|rd|th)\b/, '$1'));
  if (isFinite(ms)){ const d = new Date(ms); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
  return null;
}
async function importCSV(file){
  let rows;

  if (rows.length < 2){ toast('That file has no rows to import.'); return; }
  const head = rows[0].map(h => String(h).trim()), body = rows.slice(1, 5001);
  const numericShare = c => body.filter(r => isFinite(parseMoney(r[c]))).length / body.length;
  const dateShare = c => body.filter(r => parseAnyDate(r[c])).length / body.length;
  const find = (re, ok) => { let i = head.findIndex((h, k) => re.test(h) && ok(k)); return i; };
  let dC = find(/date|time|day|period|week|paid|payout/i, k => dateShare(k) > 0.6);
  if (dC < 0) dC = head.findIndex((h, k) => dateShare(k) > 0.6);
  let aC = find(/^net|net (pay|earnings|payout|amount)|total (pay|earnings|payout)|payout|earnings|amount|total|pay/i, k => numericShare(k) > 0.6 && k !== dC);
  if (aC < 0) for (let k = head.length - 1; k >= 0; k--) if (k !== dC && numericShare(k) > 0.6){ aC = k; break; }
  let sC = -1;
  for (const re of [/desc/i, /memo|details|note/i, /activity|trip|type|category/i]){ sC = find(re, k => k !== dC && k !== aC); if (sC >= 0) break; }
  const blob = (file.name + ' ' + head.join(' ')).toLowerCase();
  const plat = /uber ?eats/.test(blob) ? 'Uber Eats' : /uber/.test(blob) ? 'Uber' : /doordash|dasher/.test(blob) ? 'DoorDash' : /skip/.test(blob) ? 'SkipTheDishes' : /instacart/.test(blob) ? 'Instacart' : /lyft/.test(blob) ? 'Lyft' : 'Other';
  const opts = (sel, none) => (none ? `<option value="-1">${none}</option>` : '') + head.map((h, i) => `<option value="${i}" ${i === sel ? 'selected' : ''}>${esc(h || 'Column ' + (i + 1))}</option>`).join('');
  openSheet(`<h3>Import earnings</h3><p class="small muted">${esc(file.name)} · ${body.length} rows. Check that the columns are right.</p>
    <div class="map"><label class="small">App</label><select id="cP">${PLATFORMS.map(x => `<option ${x === plat ? 'selected' : ''}>${x}</option>`).join('')}</select>
    <label class="small">Date column</label><select id="cD">${opts(dC)}</select>
    <label class="small">Amount you were paid</label><select id="cA">${opts(aC)}</select>
    <label class="small">Description (optional)</label><select id="cS">${opts(sC, 'None')}</select></div>
    <div id="cPrev" style="margin-top:12px"></div>
    <div class="row" style="margin-top:14px"><button class="btn sec" style="flex:1" data-act="close">Cancel</button><button class="btn" style="flex:1" id="cGo">Import</button></div>`);
  let parsed = [];
  const build = () => {
    const d = +$('#cD').value, a = +$('#cA').value, sc = +$('#cS').value, pl = $('#cP').value;
    parsed = []; let bad = 0, dup = 0, nonPos = 0;
    body.forEach(r => {
      const date = parseAnyDate(r[d]), amt = parseMoney(r[a]);
      if (!date || !isFinite(amt)){ bad++; return; }
      if (amt <= 0){ nonPos++; return; }
      const desc = sc >= 0 ? String(r[sc] || '').trim().slice(0, 60) : '';
      const key = [pl, date, amt.toFixed(2), desc].join('|');
      if (state.income.some(i => i.key === key) || parsed.some(i => i.key === key)){ dup++; return; }
      parsed.push({ id:newId(), year:Number(date.slice(0, 4)), date, type:'self', client: pl + (desc ? ' – ' + desc : ''), amount:Math.round(amt * 100) / 100, tax:0, gst:0, key, imported:true });
    });
    const total = sum(parsed.map(x => x.amount)), years = [...new Set(parsed.map(x => x.year))].sort();
    $('#cPrev').innerHTML = `<div class="scan ${parsed.length ? 'ok' : 'warn'}">${parsed.length ? `Ready to import <b>&nbsp;${parsed.length}&nbsp;</b> payments, ${money(total)} (${years.join(', ')})` : 'No payments found with these columns.'}</div>
      ${(bad || dup || nonPos) ? `<p class="small muted">Skipped: ${[bad && bad + ' rows without a date or amount', nonPos && nonPos + ' zero or negative rows', dup && dup + ' already imported'].filter(Boolean).join(', ')}.</p>` : ''}
      ${parsed.length ? `<table class="preview-t">${parsed.slice(0, 4).map(x => `<tr><td>${x.date}</td><td>${esc(x.client)}</td><td style="text-align:right">${money(x.amount)}</td></tr>`).join('')}</table>` : ''}`;
    $('#cGo').disabled = !parsed.length;
  };
  ['#cP','#cD','#cA','#cS'].forEach(id => $(id).onchange = build); build();
  $('#cGo').onclick = () => {
    state.income = state.income.concat(parsed);
    const turnedOn = !state.profile.selfEmployed; state.profile.selfEmployed = true;
    const yrs = parsed.map(x => x.year); if (yrs.length && !yrs.includes(Y())) state.profile.year = Math.max(...yrs);
    closeSheet(); persist(); tab = 'income'; render();
    toast(`Imported ${parsed.length} payments` + (turnedOn ? '. Self-employed tools are now on.' : ''));
  };
}

async function switchMode(target){
  if (!store || store.kind === target || (target === 'device' && store.kind === 'memory')) return;
  const to = target === 'cloud' ? await makeCloudStore() : await makeDeviceStore();
  if (!to){ cloudOK = false; toast('The cloud vault is coming in the full version of the app.'); render(); return; }
  const from = store;
  openSheet(`<div class="empty"><span class="spin"></span><p>Moving ${receipts.length} receipts to ${to.label.toLowerCase()}…</p></div>`);
  let skipped = 0;
  try {

    await to.saveState(state);
    for (const m of receipts){
      let mm = {...m};
      if (m.hasFile){
        const f = await fitFor(to.kind, await from.getFile(m.id).catch(() => null));
        if (f){ await to.putFile(m.id, f); mm.fileType = f.type; mm.fileName = f.name; } else { skipped++; mm.hasFile = false; }

    if (!skipped){
      for (const m of receipts){ if (m.hasFile) await from.deleteFile(m.id).catch(() => {}); await from.deleteReceipt(m.id).catch(() => {}); }
      for (const sl of state.slips) await from.deleteFile('slip_' + sl.id).catch(() => {});
      await from.saveState(defaultState()).catch(() => {});
    }
    store = to;
    try { localStorage.setItem('taxkeep_mode', to.kind); } catch(e){}
    await loadAll(); closeSheet(); render();
    toast(skipped ? `Moved, but ${skipped} large file(s) stayed on the old storage only.` : `Your records are now ${to.kind === 'cloud' ? 'in the cloud vault' : 'on this device'}.`);
  } catch(e){ closeSheet(); toast('Move failed, nothing was deleted: ' + (e && (e.message || e.code) || 'error')); }
}

  Object.assign(state.docsDone, { 'employed:0':true });
  if (state.profile.selfEmployed){
    state.income.push({ id:newId(), year:y, date:`${y}-03-31`, type:'self', client:'Uber payout Q1', amount:6200, tax:0, gst:0 }, { id:newId(), year:y, date:`${y}-06-30`, type:'self', client:'Uber payout Q2', amount:7100, tax:0, gst:0 });
    state.mileage.push({ id:newId(), year:y, date:`${y}-04-02`, km:182, purpose:'Rideshare shift' });
    if (!state.totalKm[y]) state.totalKm[y] = '16000';
  }
  persist(); render(); toast('Sample data added');
}
async function wipe(){
  for (const m of receipts){ if (m.hasFile) await store.deleteFile(m.id).catch(() => {}); await store.deleteReceipt(m.id).catch(() => {}); }
  for (const sl of state.slips) await store.deleteFile('slip_' + sl.id).catch(() => {});
  receipts = []; state = defaultState(); await store.saveState(state).catch(() => {}); tab = 'home'; render(); toast('All data deleted');
}
function csv(rows){ return rows.map(r => r.map(c => { const s = String(c ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\r\n'); }
async function doExport(){
  if (!dl){ toast('Export isn\'t available on this device.'); return; }
  if (!window.JSZip){ toast('The ZIP tool didn’t load. Restart the app and try again.'); return; }
  const y = Y(), root = `TaxKeep_${y}`, zip = new JSZip(), rs = yearReceipts();
  openSheet(`<div class="empty"><span class="spin"></span><p>Building your ${y} package…</p></div>`);
  try {
    const rows = [['Date','Store / payee','Category','Type','Amount (CAD)','Note','File in this ZIP']];
    for (const r of rs){
      let path = '';
      if (r.hasFile){
        const f = await store.getFile(r.id).catch(() => null);
        if (f && f.dataUrl && f.dataUrl.includes(',')){
          path = `Receipts/${safeName(catLabel(r.category))}/${r.date}_${safeName(r.vendor)}_${num(r.amount).toFixed(2)}_${r.id.slice(-4)}.${extFor(f)}`;
          const [head, body] = f.dataUrl.split(',');
          if (head.includes(';base64')) zip.file(`${root}/${path}`, body, { base64:true }); else zip.file(`${root}/${path}`, decodeURIComponent(body));
        }
      }
      rows.push([r.date, r.vendor, catLabel(r.category), isBiz(r.category) ? 'Business (T2125)' : 'Personal', num(r.amount).toFixed(2), r.note, path]);
    }
    zip.file(`${root}/Receipts_summary.csv`, csv(rows));
    const docs = reqDocs();
    zip.file(`${root}/Checklist.csv`, csv([['Document','Gathered']].concat(docs.map(d => [d.label, state.docsDone[d.key] ? 'Yes' : 'No']))
      .concat([[],['Question','Answer']]).concat(QUESTIONS.map(q => [q.q, state.answers[q.id] || 'Not answered']))));
    const R = room();
    zip.file(`${root}/RRSP_TFSA_FHSA.csv`, csv([['Account','Limit / room','Contributed','Withdrawn','Left']].concat([
      ['RRSP', R.rr.set ? R.rr.limit : 'not entered', R.rr.used, '', R.rr.set ? R.rr.left : ''],
      ['TFSA', R.tf.set ? R.tf.limit : 'not entered', R.tf.used, R.tf.wd, R.tf.set ? R.tf.left : ''],
      ['FHSA', R.fh.open ? R.fh.limit : 'no FHSA', R.fh.open ? R.fh.used : '', '', R.fh.open ? R.fh.left : '']])
      .concat([[],['Account','Type','Date','Amount']]).concat(state.room.contribs.filter(x => x.year === y).map(x => [x.acct.toUpperCase(), x.type, x.date, x.amount]))));
    const yi = state.income.filter(x => x.year === y).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    if (yi.length) zip.file(`${root}/Income.csv`, csv([['Date','Type','From','Amount','Tax deducted','GST/HST collected']].concat(yi.map(x => [x.date, INCOME_LABEL[x.type] || x.type, x.client, num(x.amount).toFixed(2), num(x.tax) ? num(x.tax).toFixed(2) : '', num(x.gst) ? num(x.gst).toFixed(2) : '']))));
    const incBy = {}; yi.forEach(x => incBy[x.type] = (incBy[x.type] || 0) + num(x.amount));
    const incHtml = yi.length ? `<h2>Income</h2><table>${INCOME_TYPES.filter(t => incBy[t[0]]).map(([k, l]) => `<tr><td>${esc(l)}</td><td>${money(incBy[k])}</td></tr>`).join('')}<tr><td>Tax already deducted</td><td>${money(sum(yi.map(x => x.tax)))}</td></tr></table>` : '';
    let bizHtml = '';
    if (state.profile.selfEmployed){
      const B = biz();
      zip.file(`${root}/Mileage_log.csv`, csv([['Date','Purpose','Business km']].concat(B.mil.map(x => [x.date, x.purpose, x.km])).concat([[],['Total km driven in year', B.totalKm || 'not entered'],['Business km', B.bizKm]])));
      bizHtml = `<h2>Business (T2125)</h2><table><tr><td>Self-employed income</td><td>${money(B.income)}</td></tr><tr><td>GST/HST collected</td><td>${money(B.gst)}</td></tr><tr><td>Business km / total km</td><td>${B.bizKm} / ${B.totalKm || '?'}</td></tr></table>`;
    }
    const byCat = {}; rs.forEach(r => byCat[r.category] = (byCat[r.category] || 0) + num(r.amount));
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${root} summary</title><style>body{font-family:Arial,sans-serif;max-width:760px;margin:30px auto;color:#222}table{border-collapse:collapse;width:100%;margin-bottom:20px}td,th{border-bottom:1px solid #ddd;padding:6px;text-align:left}td:last-child{text-align:right}h1{color:#0f6b52}</style></head><body>
      <h1>Tax package ${y}</h1><p>${esc(state.profile.name || 'Client')} · ${esc(state.profile.province)} · prepared ${today()} with TaxKeep</p>
      <h2>Receipts by category</h2><table>${Object.entries(byCat).map(([c, a]) => `<tr><td>${esc(catLabel(c))}</td><td>${money(a)}</td></tr>`).join('')}<tr><th>Total (${rs.length} receipts)</th><th style="text-align:right">${money(sum(rs.map(r => r.amount)))}</th></tr></table>
      <h2>Documents</h2><table>${docs.map(d => `<tr><td>${esc(d.label)}</td><td>${state.docsDone[d.key] ? '✓ gathered' : 'missing'}</td></tr>`).join('') || '<tr><td>Checklist not answered</td><td></td></tr>'}</table>
      <h2>Registered accounts</h2><table><tr><td>RRSP contributed / limit</td><td>${money(R.rr.used)} / ${R.rr.set ? money(R.rr.limit) : '?'}</td></tr><tr><td>TFSA contributed / room</td><td>${money(R.tf.used)} / ${R.tf.set ? money(R.tf.limit) : '?'}</td></tr>${R.fh.open ? `<tr><td>FHSA contributed / room</td><td>${money(R.fh.used)} / ${money(R.fh.limit)}</td></tr>` : ''}</table>
      ${incHtml}${bizHtml}<p style="color:#888;font-size:12px">Organized records only. Not tax advice.</p></body></html>`;
    zip.file(`${root}/Summary_for_preparer.html`, html);
    const ys = yearSlips();
    if (ys.length){
      const srows = [['Slip','Issued by','Box','Description','Amount','Photo in this ZIP']];
      for (const sl of ys){
        let path = '';
        if (sl.hasFile){ const f = await store.getFile('slip_' + sl.id).catch(() => null);
          if (f && f.dataUrl && f.dataUrl.includes(',')){ path = `Slips/${safeName(TaxKeepForms.short(sl.type))}_${safeName(sl.issuer)}_${sl.id.slice(-4)}.${extFor(f)}`; const [h, b] = f.dataUrl.split(','); if (h.includes(';base64')) zip.file(`${root}/${path}`, b, { base64:true }); else zip.file(`${root}/${path}`, decodeURIComponent(b)); } }
        const def = TaxKeepForms.SLIP_TYPES[sl.type] || TaxKeepForms.SLIP_TYPES.OTHER;
        def.boxes.forEach(([code, label], i) => { if ((sl.boxes || {})[code] != null) srows.push([TaxKeepForms.short(sl.type) + (sl.label ? ' ' + sl.label : ''), sl.issuer, code === 'amt' || code === 'tax' ? '' : code, label, num(sl.boxes[code]), path]); });
      }
      zip.file(`${root}/Slips.csv`, csv(srows));
    }
    if (window.jspdf && window.TaxKeepForms){ try { zip.file(`${root}/Worksheets_${y}.pdf`, worksheetPdf()); } catch(e){} }
    const blob = await zip.generateAsync({ type:'blob' });
    closeSheet();
    await dl.save({ filename:`${root}_package.zip`, data:blob });
    state.lastExport = Date.now(); persist(); render(); toast('Package ready');
  } catch(e){
    closeSheet();
    if (e && e.code === 'declined') toast('Export cancelled');
    else if (e && e.code === 'rate_limited') toast('A save prompt is already open');
    else toast('Export failed: ' + (e && (e.message || e.code) || 'error'));
  }
}

/* ---------------- events ---------------- */
document.addEventListener('click', async e => {
  if (e.target.closest('label') && e.target.closest('label').querySelector('input[type=file]')) pauseLockFor();
  const t = e.target.closest('[data-tab],[data-act],[data-filter],[data-open],[data-ans],[data-mode],[data-delreceipt],[data-delcontrib],[data-delincome],[data-deltrip],[data-editincome],[data-slip],[data-seg]');
  if (e.target.id === 'modal') { closeSheet(); return; }
  if (!t) return;
  const d = t.dataset;
  if (d.tab && t.tagName !== 'SELECT'){ tab = d.tab; filter = 'all'; render(); window.scrollTo(0, 0); return; }
  if (d.filter){ filter = d.filter; render(); return; }
  if (d.seg){ formsSeg = d.seg; render(); return; }
  if (d.slip){ openSlip(d.slip); return; }
  if (d.open){ openReceipt(d.open); return; }
  if (d.ans){ state.answers[d.ans] = d.v; if (d.ans === 'self' && d.v === 'yes' && !state.profile.selfEmployed){ state.profile.selfEmployed = true; toast('Business tools turned on'); } persist(); render(); return; }
  if (d.mode){ switchMode(d.mode); return; }
  if (d.delreceipt){ const id = d.delreceipt; confirmSheet('Delete this receipt?', 'The receipt and its photo will be removed.', 'Delete', async () => { await store.deleteFile(id).catch(() => {}); await store.deleteReceipt(id).catch(() => {}); receipts = receipts.filter(x => x.id !== id); render(); toast('Deleted'); }); return; }
  if (d.delcontrib){ state.room.contribs = state.room.contribs.filter(x => x.id !== d.delcontrib); persist(); render(); return; }
  if (d.editincome){ const x = state.income.find(i => i.id === d.editincome); if (x) incomeForm(x); return; }
  if (d.delincome){ state.income = state.income.filter(x => x.id !== d.delincome); persist(); render(); return; }
  if (d.deltrip){ state.mileage = state.mileage.filter(x => x.id !== d.deltrip); persist(); render(); return; }
  switch (d.act){
    case 'close': closeSheet(); break;
    case 'add': receiptForm(null); break;
    case 'addSlip': slipForm(null); break;
    case 'wsPdf': saveWorksheets(); break;
    case 'demo': addDemo(); break;
    case 'export': doExport(); break;
    case 'wipe': confirmSheet('Delete everything?', 'All receipts, files and answers in this storage will be permanently removed.', 'Delete all', wipe); break;
    case 'addContrib': simpleForm('Add RRSP / TFSA / FHSA entry', [
        { id:'acct', label:'Account', type:'select', opts:[['rrsp','RRSP'],['tfsa','TFSA'],['fhsa','FHSA']] },
        { id:'type', label:'Type', type:'select', opts:[['contrib','Contribution'],['withdraw','Withdrawal (TFSA)']] },
        { id:'date', label:'Date', type:'date', value:today() }, { id:'amount', label:'Amount ($)', type:'number', ph:'0.00' }],
      v => { if (!num(v.amount)){ toast('Enter an amount'); return false; } state.room.contribs.push({ id:newId(), year:Y(), acct:v.acct, type:v.type, date:v.date, amount:num(v.amount) }); }); break;
    case 'addIncome': incomeForm(null); break;
    case 'incomeAll': incomeShowAll = true; render(); break;
    case 'lockNow': if (window.TaxKeepLock) TaxKeepLock.lockNow(); break;
    case 'testRem': if (!window.TaxKeepReminders || !TaxKeepReminders.available()){ toast('Reminders work in the installed Android app.'); break; }
      TaxKeepReminders.test().then(r => toast(r.ok ? 'A test reminder will pop up in 5 seconds.' : 'Notifications are blocked. Turn them on in Settings → Apps → TaxKeep.')); break;
    case 'addTrip': simpleForm('Log a business trip', [
        { id:'date', label:'Date', type:'date', value:today() }, { id:'purpose', label:'Purpose / destination', ph:'e.g. Client site, deliveries' },
        { id:'km', label:'Kilometres', type:'number', ph:'0' }],
      v => { if (!num(v.km)){ toast('Enter the km'); return false; } state.mileage.push({ id:newId(), year:Y(), date:v.date, purpose:v.purpose, km:num(v.km) }); }); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if (d.act === 'year'){ state.profile.year = Number(t.value); persist(); render(); }
  else if (d.doc){ state.docsDone[d.doc] = t.checked; persist(); render(); }
  else if (d.room !== undefined){ state.room[d.room] = t.value; persist(); render(); }
  else if (t.hasAttribute('data-fhsa')){ state.room.fhsaOpen = t.checked; persist(); render(); }
  else if (t.hasAttribute('data-totalkm')){ state.totalKm[Y()] = t.value; persist(); render(); }
  else if (d.prof){ state.profile[d.prof] = t.value; persist(); render(); }
  else if (t.hasAttribute('data-se')){ state.profile.selfEmployed = t.checked; persist(); render(); if (state.reminders.on) syncReminders(); }
  else if (t.id === 'csvIn'){ const f = t.files && t.files[0]; window.__tkPauseLock = false; if (f) importCSV(f); t.value = ''; }
  else if (d.wait){ state.waitlist[d.wait] = t.checked; persist(); }
  else if (d.rem){ if (!state.reminders.on){ state.reminders = { on:true, deadlines:false, instalments:false, monthly:false }; } state.reminders[d.rem] = t.checked; persist(); syncReminders().then(render); render(); }
  else if (t.hasAttribute('data-lock')){
    if (!window.TaxKeepLock) return;
    if (t.checked) TaxKeepLock.setupPin().then(ok => { toast(ok ? 'PIN lock is on' : 'PIN not set'); render(); });
    else TaxKeepLock.verify().then(ok => { if (ok){ TaxKeepLock.turnOff(); toast('Lock turned off'); } render(); });
  }
  else if (t.hasAttribute('data-bio')){ TaxKeepLock.setBio(t.checked).then(ok => { if (!ok && t.checked) toast('No fingerprint is set up on this phone.'); render(); }); }
  else if (d.act === 'pct'){ state.setAsidePct = Number(t.value); persist(); render(); }
});
document.addEventListener('input', e => { if (e.target.dataset.act === 'pct'){ const b = e.target.nextElementSibling; if (b) b.textContent = e.target.value + '%'; } });

/* ---------------- start ---------------- */
(async () => {
  let pref = 'device'; try { pref = localStorage.getItem('taxkeep_mode') || 'device'; } catch(e){}
  if (pref === 'cloud'){ const c = await makeCloudStore().catch(() => null); if (c){ store = c; cloudOK = true; } }
  if (!store) store = await makeDeviceStore();
  try { if (window.TaxKeepLock) TaxKeepLock.init(); } catch(e){}
  await loadAll();
  if (!state.onboarded && (receipts.length || state.income.length || Object.keys(state.answers).length)){ state.onboarded = true; persist(); }
  render();
  if (!state.onboarded) showOnboarding(); else if (state.reminders.on) syncReminders();
  capUse('downloads').then(x => { dl = x; if (tab === 'more') render(); });
  if (cloudOK === null) makeCloudStore().then(c => { cloudOK = !!c; if (tab === 'more') render(); }).catch(() => { cloudOK = false; });
})();
